# A test that waits forever must fail instead of holding a CI or build slot.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# live_handoff_carries_more_panes_than_one_scm_rights_message has ~160 s of in-test deadlines.
[[profile.default.overrides]]
filter = 'binary(live_handoff)'
slow-timeout = { period = "60s", terminate-after = 5 }
